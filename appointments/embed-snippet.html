<!-- Paste into Drupal (Full HTML / source view). The iframe resizes to fit the chart.
     The iframe stays 400px tall (scroll inside it) on Drupal edit, preview and layout
     pages, and grows to the chart's full height on the published page. -->
<iframe id="bc-appt-frame"
        src="https://zhangj-brennan.github.io/scotus_encyclopedia/appointments/index.html?v=2"
        style="width:100%; height:400px; border:0; display:block;"
        title="Presidential nominations of a justice to the Supreme Court"></iframe>
<script>
(function () {
  // In the Drupal editor, preview or layout screens keep the short scrollable preview
  if (/\/node\/(add|\d+\/edit|preview)|\/layout\b/.test(location.pathname)) return;
  window.addEventListener('message', function (e) {
    if (e.origin !== 'https://zhangj-brennan.github.io' || !e.data || e.data.type !== 'appt-height') return;
    // Look the iframe up on each message, in case the CMS re-renders it after this script runs
    var frame = document.getElementById('bc-appt-frame');
    if (frame) frame.style.height = e.data.height + 'px';
  });
})();
</script>
