<!-- Paste into Drupal (Full HTML / source view). The iframe resizes to fit the chart
     when switching views or showing unconfirmed nominations. -->
<iframe id="appt-frame"
        src="https://zhangj-brennan.github.io/scotus_encyclopedia/appointments/index.html"
        style="width:100%; height:1200px; border:0; display:block;"
        scrolling="no" title="Presidential nominations of a justice to the Supreme Court"></iframe>
<script>
(function () {
  var frame = document.getElementById('appt-frame');
  window.addEventListener('message', function (e) {
    if (e.origin !== 'https://zhangj-brennan.github.io' || e.source !== frame.contentWindow) return;
    if (e.data && e.data.type === 'appt-height') frame.style.height = e.data.height + 'px';
  });
})();
</script>
