<!-- Paste into Drupal (Full HTML / source view).
     The encyclopedia fills the iframe and scrolls inside it (filters and grid scroll
     separately), so the iframe has a fixed height rather than resizing to fit.
     The wrapper breaks out of a narrow Drupal text column: it is up to 1200px wide
     (never wider than the screen minus 16px on each side), centered on the column. -->
<div style="position:relative; left:50%; transform:translateX(-50%); width:min(1200px, calc(100vw - 32px));">
  <iframe id="bc-encyclopedia-frame"
          src="https://zhangj-brennan.github.io/scotus_encyclopedia/encyclopedia/index.html?v=3"
          style="width:100%; height:85vh; min-height:600px; max-height:1000px; border:0; display:block;"
          title="SCOTUS Encyclopedia"
          loading="lazy"></iframe>
</div>
