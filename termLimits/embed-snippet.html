<!-- Paste into Drupal (Full HTML / source view). Full-window-width pinned iframe;
     the page scroll drives the Term Limits scrollytelling via postMessage. -->
<div id="tl-scrolly" style="position:relative; height:800vh; width:100vw; margin-left:calc(50% - 50vw); margin-right:calc(50% - 50vw);">
  <div style="position:sticky; top:0; height:100vh; overflow:hidden;">
    <iframe id="tl-frame"
            src="https://zhangj-brennan.github.io/scotus_encyclopedia/termLimits/index.html"
            style="width:100%; height:100%; border:0; display:block;"
            scrolling="no" title="Supreme Court Tenure Explainer"></iframe>
  </div>
</div>
<script>
(function () {
  var ORIGIN = 'https://zhangj-brennan.github.io';
  var wrap = document.getElementById('tl-scrolly');
  var frame = document.getElementById('tl-frame');
  var flingId = 0;

  function report() {
    var total = wrap.offsetHeight - window.innerHeight;
    var p = total > 0 ? Math.min(1, Math.max(0, -wrap.getBoundingClientRect().top / total)) : 0;
    frame.contentWindow.postMessage({ type: 'tl-progress', progress: p }, ORIGIN);
  }

  function scrollByPx(dy) {
    window.scrollBy({ top: dy, behavior: 'instant' });
  }

  window.addEventListener('message', function (e) {
    if (e.origin !== ORIGIN || e.source !== frame.contentWindow || !e.data) return;
    var d = e.data;
    if (d.type === 'tl-height') {
      // Match the wrapper to the embedded page's height so scrolling is 1:1
      wrap.style.height = d.height + 'px';
      report();
    } else if (d.type === 'tl-scroll') {
      cancelAnimationFrame(flingId);
      scrollByPx(d.dy);
    } else if (d.type === 'tl-fling') {
      var v = d.v * 16;
      cancelAnimationFrame(flingId);
      (function step() {
        if (Math.abs(v) < 0.5) return;
        scrollByPx(v);
        v *= 0.95;
        flingId = requestAnimationFrame(step);
      })();
    }
  });

  window.addEventListener('scroll', report, { passive: true });
  window.addEventListener('resize', report);
  frame.addEventListener('load', report);
})();
</script>
