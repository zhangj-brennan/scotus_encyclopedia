<!-- Paste into Drupal (Full HTML / source view). The iframe resizes to fit the chart. -->
<iframe id="tl-custom-frame"
        src="https://zhangj-brennan.github.io/scotus_encyclopedia/termLimits/customizable.html"
        style="width:100%; height:900px; border:0; display:block;"
        scrolling="no" title="Supreme Court Tenure: Customizable Durability Chart"></iframe>
<script>
(function () {
  var frame = document.getElementById('tl-custom-frame');
  window.addEventListener('message', function (e) {
    if (e.origin !== 'https://zhangj-brennan.github.io' || e.source !== frame.contentWindow) return;
    if (e.data && e.data.type === 'tl-single-height') frame.style.height = e.data.height + 'px';
  });
})();
</script>
