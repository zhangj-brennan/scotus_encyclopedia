<!-- Paste into Drupal (Full HTML / source view). The iframe resizes to fit the chart. -->
<iframe id="bc-tl-custom-frame"
        src="https://zhangj-brennan.github.io/scotus_encyclopedia/termLimits/customizable.html?v=6"
        style="width:100%; height:900px; border:0; display:block;"
        scrolling="no" title="Supreme Court Tenure: Customizable Durability Chart"></iframe>
<script>
(function () {
  window.addEventListener('message', function (e) {
    if (e.origin !== 'https://zhangj-brennan.github.io' || !e.data || e.data.type !== 'tl-custom-height') return;
    // Look the iframe up on each message, in case the CMS re-renders it after this script runs
    var frame = document.getElementById('bc-tl-custom-frame');
    if (frame) frame.style.height = e.data.height + 'px';
  });
})();
</script>
